blueprint:
  name: Family Room Lamp
  description: >
    When the selected TV entity leaves its active states (for example it goes
    from on or playing to off, standby or unavailable), wait until the chosen
    motion entity has been clear for the configured amount of time, then turn
    off the selected light. The motion entity can be a binary sensor or a
    compatible group entity that reports on/off.
  domain: automation
  input:
    tv_entity:
      name: TV entity
      description: >
        Entity that represents the TV power state, such as a media player,
        switch or binary sensor.
      selector:
        entity:
    tv_active_states:
      name: TV active states
      description: >
        States that mean the TV is on. The light-off sequence starts when the
        TV changes from one of these states to any other state (off, standby,
        unavailable and so on), and stops if the TV returns to one of them.
        Add a custom state if your TV reports something not listed here.
      default:
        - "on"
        - playing
        - paused
        - buffering
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - "on"
            - playing
            - paused
            - buffering
            - idle
    motion_entity:
      name: Motion entity
      description: >
        Motion binary sensor or compatible group entity that is on when motion
        is detected and off when motion stops.
      selector:
        entity:
          filter:
            domain:
              - binary_sensor
              - group
    light_target:
      name: Light
      description: Light to turn off after the TV is off and motion has cleared.
      selector:
        target:
          entity:
            - domain: light
    no_motion_wait:
      name: No-motion delay
      description: How long motion must stay clear before the light turns off.
      default:
        minutes: 5
      selector:
        duration:
    tv_on_cancel_delay:
      name: TV-on confirmation delay
      description: >
        How long the TV must stay on before canceling the light-off sequence.
        This helps ignore brief state bounce-backs from some TV integrations.
      default:
        seconds: 10
      selector:
        duration:

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input tv_entity
    from: !input tv_active_states
    not_to: !input tv_active_states

actions:
  - alias: Wait for the motion entity to remain clear while the TV stays off
    repeat:
      sequence:
        - alias: If motion is still active, wait for it to clear or stop if the TV turns back on
          if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: !input motion_entity
                  state: "off"
          then:
            - wait_for_trigger:
                - trigger: state
                  entity_id: !input motion_entity
                  to: "off"
                - trigger: state
                  entity_id: !input tv_entity
                  to: !input tv_active_states
                  for: !input tv_on_cancel_delay

        - if:
            - condition: state
              entity_id: !input tv_entity
              state: !input tv_active_states
          then:
            - stop: TV turned back on before the no-motion delay completed

        - alias: Restart the timer if motion returns or stop if the TV turns on
          wait_for_trigger:
            - trigger: state
              entity_id: !input motion_entity
              to: "on"
            - trigger: state
              entity_id: !input tv_entity
              to: !input tv_active_states
              for: !input tv_on_cancel_delay
          timeout: !input no_motion_wait
          continue_on_timeout: true
      until:
        - condition: template
          value_template: "{{ not wait.completed }}"

  - alias: Only continue if the TV did not come back on
    condition: not
    conditions:
      - condition: state
        entity_id: !input tv_entity
        state: !input tv_active_states

  - condition: state
    entity_id: !input motion_entity
    state: "off"

  - action: light.turn_off
    target: !input light_target
